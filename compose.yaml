# BiliLink 的 Docker Compose 部署文件，启动：docker compose up -d
# 自定义配置：在本文件同目录创建 .env（参考 .env.example）；使用默认配置时可以不创建。
services:
  bililink:
    image: ghcr.io/uzkis/bililink:latest
    restart: unless-stopped
    # 使用宿主机网络：不创建单独的 Docker 网络，也没有端口映射（端口映射会绕过 ufw 等防火墙的规则），
    # 服务直接监听宿主机端口，访问由系统防火墙与云服务器安全组控制。
    network_mode: host
    environment:
      # 监听端口：更换时在 .env 中设置 BILILINK_PORT。
      # 容器以非 root 用户运行，不能使用 1024 以下的端口。
      - BILILINK_PORT=${BILILINK_PORT:-5000}
    env_file:
      - path: .env
        required: false
    # 安全加固：服务不写磁盘，也不需要任何特权。
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
