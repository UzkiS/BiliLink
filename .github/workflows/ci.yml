name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv 版本取自 pyproject.toml 的 required-version，Python 版本取自 .python-version。
      # 本 workflow 会发布镜像，因此不使用任何缓存，杜绝缓存投毒。
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 安装依赖
        run: uv sync --locked

      # 与本地提交前执行的命令完全相同，检查项只在 pyproject.toml 中定义一次。
      - name: uv run poe check
        run: uv run poe check

  docker:
    name: 镜像构建与冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bililink:ci

      - name: 等待容器健康检查通过
        run: |
          docker run --detach --name bililink bililink:ci
          for _ in $(seq 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bililink)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs bililink
          exit 1

      # httpx2 通过 truststore 使用系统证书库；/healthz 不访问外网，缺少证书时上一步仍会通过。
      - name: 镜像包含 CA 证书
        run: docker run --rm --entrypoint test bililink:ci -s /etc/ssl/certs/ca-certificates.crt

  publish:
    name: 发布镜像到 GHCR
    # 只在推送到 main 或推送版本标签时发布；PR 只检查、不发布。
    if: github.event_name == 'push'
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版本号的唯一事实源是 pyproject.toml，标签只是它的发布记号。
      - name: 版本标签与 pyproject.toml 一致
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::标签 $TAG 与 pyproject.toml 中的版本 $version 不一致"
            exit 1
          fi

      # GHCR 要求镜像名全部小写。
      - name: 确定镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推送 main：main、sha-<提交>；推送 vX.Y.Z：X.Y.Z、X.Y、X、latest、sha-<提交>。
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true

      # 生成签名的构建来源证明，可用 `gh attestation verify` 验证镜像确实由本仓库的 CI 构建。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
