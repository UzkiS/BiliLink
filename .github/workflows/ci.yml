name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      prepare-release:
        description: 维护版本 PR 与 Release（仅 main，发布中断时可手动恢复）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv 版本取自 pyproject.toml 的 required-version，Python 版本取自 .python-version。
      # 本 workflow 会发布镜像，因此不使用任何缓存，杜绝缓存投毒。
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: 安装依赖
        run: uv sync --locked

      # 与本地提交前执行的命令完全相同，检查项只在 pyproject.toml 中定义一次。
      - name: uv run poe check
        run: uv run poe check

  docker:
    name: 镜像构建与冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bililink:ci

      - name: 等待容器健康检查通过
        run: |
          docker run --detach --name bililink bililink:ci
          for _ in $(seq 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' bililink)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs bililink
          exit 1

      # httpx2 通过 truststore 使用系统证书库；/healthz 不访问外网，缺少证书时上一步仍会通过。
      - name: 镜像包含 CA 证书
        run: docker run --rm --entrypoint test bililink:ci -s /etc/ssl/certs/ca-certificates.crt

  publish:
    name: 发布镜像到 GHCR
    # 版本发布工作流使用默认令牌创建标签后会显式调度 CI；版本 PR 的调度只检查。
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版本号的唯一事实源是 pyproject.toml，标签只是它的发布记号。
      - name: 版本标签与 pyproject.toml 一致
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::标签 $TAG 与 pyproject.toml 中的版本 $version 不一致"
            exit 1
          fi

      # GHCR 要求镜像名全部小写。
      - name: 确定镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推送 main：main、sha-<提交>；推送 vX.Y.Z：X.Y.Z、X.Y、X、latest、sha-<提交>。
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true

      # 生成签名的构建来源证明，可用 `gh attestation verify` 验证镜像确实由本仓库的 CI 构建。
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: 维护版本 PR 与 Release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.prepare-release == true)
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please 不管理 uv.lock；在版本 PR 内运行 uv 生成锁文件，并更新内置 IP 段。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.release.outputs.prs_created == 'true'
        with:
          enable-cache: false

      - name: 准备版本 PR 并调度检查
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          uv run poe release-prepare
          if ! git diff --quiet -- uv.lock src/bililink/cn_networks.txt; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv.lock src/bililink/cn_networks.txt
            git commit -m 'chore: 同步版本锁文件与内置 IP 段'
            git -c credential.helper='!gh auth git-credential' push origin "HEAD:$RELEASE_BRANCH"
          fi
          # 默认令牌产生的 push/PR 事件不会触发其他工作流，显式调度到版本 PR 的最新提交。
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

      - name: 调度正式镜像发布
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yml --ref "$RELEASE_TAG"
